<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEJANDRO FABIAN | FX &amp; VFX</title>
    <meta name="description" content="Portfolio y contacto de Alejandro Fabian, artista de FX &amp; VFX.">
    <style>
        :root {
            --bg: #050505;
            --surface: #101010;
            --border: #2b2b2b;
            --text: #ffffff;
            --text-muted: #7a7a7a;
            --text-soft: #a8a8a8;
            --accent: #ffb300;
            --wa-color: #25D366;
            --ig-color: #FCAF45;
            --radius: 12px;
            --shadow-strong: 0 22px 70px rgba(0, 0, 0, 0.9);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px 64px;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: clamp(1.9rem, 3vw, 2.4rem);
            letter-spacing: 0.6em;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
            text-indent: 0.6em;
        }

        .tagline {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            margin: 0;
        }

        /* Contenedor del video */
        .media-container {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-strong);
            background: var(--surface);
            position: relative;
        }

        /* Ratio 16:9 */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }

        /* Thumbnail de portada antes de dar play */
        .video-thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        /* Overlay oscuro sobre la thumbnail */
        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .video-overlay:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        /* Botón play minimalista */
        .play-btn {
            width: 64px;
            height: 64px;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .video-overlay:hover .play-btn {
            transform: scale(1.1);
            border-color: #ffffff;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 10px 0 10px 20px;
            border-color: transparent transparent transparent rgba(255,255,255,0.9);
            margin-left: 4px; /* centrado óptico */
        }

        /* iframe YouTube, oculto hasta dar play */
        .video-iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .profesion {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin: 6px 0 0;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 6px 22px;
            border-radius: 999px;
            border: 1px solid rgba(255, 179, 0, 0.35);
            background: radial-gradient(circle at 0% 0%, rgba(255,179,0,0.12), transparent 60%);
        }

        .separator {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            transform: translateY(-1px);
            font-weight: 300;
            opacity: 0.8;
        }

        .proximamente {
            font-size: 1.22rem;
            color: var(--text-soft);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin: 52px 0 52px;
            font-weight: 300;
            text-indent: 0.5em;
        }

        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            padding-top: 30px;
            width: 100%;
            max-width: 520px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(120px, 1fr));
            gap: 40px;
            align-items: start;
            justify-items: center;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .contact-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.28em;
        }

        .link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 74px;
            height: 74px;
            border-radius: 999px;
        }

        .icon {
            width: 60px;
            height: 60px;
            transition:
                transform 0.28s ease,
                stroke 0.28s ease,
                fill 0.28s ease;
        }

        .icon-wa path {
            fill: none;
            stroke: var(--wa-color);
            stroke-width: 0.55;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-ig rect,
        .icon-ig circle {
            fill: none;
            stroke: var(--ig-color);
            stroke-width: 0.55;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-ig .ig-dot {
            fill: var(--ig-color);
            stroke: none;
        }

        .link:hover .icon,
        .link:focus-visible .icon {
            transform: translateY(-4px);
        }

        .link:focus-visible {
            outline: 1px solid rgba(255, 179, 0, 0.7);
            outline-offset: 4px;
        }

        footer {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #555555;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (max-width: 520px) {
            h1 { letter-spacing: 0.42em; text-indent: 0.42em; }
            .profesion { font-size: 0.95rem; letter-spacing: 0.24em; padding-inline: 18px; }
            .proximamente { font-size: 1.06rem; letter-spacing: 0.38em; text-indent: 0.38em; margin: 44px 0 44px; }
            .contact-grid { gap: 30px; }
            .contact-label { font-size: 0.76rem; letter-spacing: 0.22em; }
            .play-btn { width: 52px; height: 52px; }
        }

        @media (min-width: 768px) {
            body { padding-top: 48px; }
            main { gap: 40px; }
            header { gap: 16px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Alejandro Fabian</h1>
            <p class="tagline">FX &amp; VFX artist</p>
        </header>

        <!-- VIDEO: reemplaza portada.jpg -->
        <section aria-label="Reel principal" class="media-container">
            <div class="video-wrapper">
                <!-- Thumbnail: usá tu portada.jpg hasta tener el video listo -->
                <img class="video-thumb" src="portada.jpg" alt="Ver reel de FX y VFX de Alejandro Fabian">
                <!-- Overlay con botón play minimalista -->
                <div class="video-overlay" id="playOverlay">
                    <div class="play-btn">
                        <div class="play-icon"></div>
                    </div>
                </div>
                <!-- iframe YouTube: reemplazá TU_VIDEO_ID con el ID real -->
                <iframe
                    class="video-iframe"
                    id="ytVideo"
                    src=""
                    data-src="https://www.youtube.com/embed/qUVEHgIJQJg?autoplay=1&rel=0&modestbranding=1"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen
                ></iframe>
            </div>
        </section>

        <section aria-label="Especialidades">
            <div class="profesion">
                <span>FX</span>
                <span class="separator">|</span>
                <span>VFX</span>
            </div>
        </section>

        <section aria-label="Próximamente portfolio completo">
            <p class="proximamente">Próximamente</p>
        </section>

        <section class="contact-section" aria-label="Contacto y portfolio">
            <div class="contact-grid">
                <div class="contact-item">
                    <p class="contact-label">Contacto</p>
                    <a
                        href="https://wa.me/5491165044902"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="link"
                        aria-label="Contactar por WhatsApp a Alejandro Fabian, se abre en una nueva pestaña"
                    >
                        <img
                            style="width:60px;height:60px;object-fit:contain;display:block;transition:transform 0.28s ease;"
                            src="wa-logo.png"
                            alt="WhatsApp"
                        >
                    </a>
                </div>

                <!-- Portfolio → Instagram -->
                <div class="contact-item">
                    <p class="contact-label">Portfolio</p>
                    <a
                        href="https://www.instagram.com/alefabianvfx?igsh=YWkyZmtwaW8zdjVy"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="link"
                        aria-label="Instagram de Alejandro Fabian, se abre en una nueva pestaña"
                    >
                        <svg class="icon icon-ig" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
                            <circle cx="12" cy="12" r="4.5"/>
                            <circle class="ig-dot" cx="17" cy="7" r="0.9"/>
                        </svg>
                    </a>
                </div>
            </div>
        </section>


        <footer>
            © <span id="year"></span> Alejandro Fabian
        </footer>
    </main>

    <script>
        // Año dinámico
        document.getElementById('year').textContent = new Date().getFullYear();

        // Play button
        const overlay = document.getElementById('playOverlay');
        const iframe = document.getElementById('ytVideo');
        const thumb = document.querySelector('.video-thumb');

        overlay.addEventListener('click', function () {
            iframe.src = iframe.dataset.src;
            iframe.style.display = 'block';
            overlay.style.display = 'none';
            thumb.style.display = 'none';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEJANDRO FABIAN | FX & VFX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            text-align: center;
            padding-top: 100px; /* Dale aire superior al contenido */
        }

        .media-container {
            width: 95%;
            max-width: 900px; /* Imagen más grande */
            margin-bottom: 50px;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        img {
            width: 100%;
            display: block;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 8px;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
        }

        .profesion {
            color: #FFB300; 
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin: 15px 0 35px 0;
            text-transform: uppercase;
        }

        .proximamente {
            font-size: 0.85rem;
            color: #444;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 60px;
        }

        .contact-section {
            border-top: 1px solid #1a1a1a;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-bottom: 80px;
        }

        .contact-section p {
            font-size: 0.8rem;
            color: #666;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .icons-container {
            display: flex;
            gap: 40px;
        }

        .icon {
            width: 45px; /* Iconos un poco más grandes */
            height: 45px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Color de Instagram permanente */
        .icon-ig {
            fill: #E4405F;
        }

        /* Color de WhatsApp permanente */
        .icon-wa {
            fill: #25D366;
        }

        /* Animación al pasar el mouse */
        .link:hover .icon {
            transform: translateY(-10px);
            filter: brightness(1.2);
        }

        .link {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="media-container">
        <!-- Imagen vinculada como portada.jpg -->
        <img src="portada.jpg" alt="Alejandro Fabian VFX Portfolio">
    </div>

    <h1>ALEJANDRO FABIAN</h1>
    <div class="profesion">FX | VFX</div>
    
    <div class="proximamente">Próximamente...</div>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEJANDRO FABIAN | FX &amp; VFX</title>
    <meta name="description" content="Portfolio y contacto de Alejandro Fabian, artista de FX &amp; VFX.">
    <style>
        :root {
            --bg: #050505;
            --surface: #101010;
            --border: #2b2b2b;
            --text: #ffffff;
            --text-muted: #7a7a7a;
            --text-soft: #a8a8a8;
            --accent: #ffb300;
            --wa-color: #25D366;
            --ig-color: #FCAF45;
            --radius: 12px;
            --shadow-strong: 0 22px 70px rgba(0, 0, 0, 0.9);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px 64px;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: clamp(1.9rem, 3vw, 2.4rem);
            letter-spacing: 0.6em;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
            text-indent: 0.6em;
        }

        .tagline {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            margin: 0;
        }

        .media-container {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-strong);
            background: var(--surface);
        }

        .media-container img {
            width: 100%;
            display: block;
        }

        .profesion {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin: 6px 0 0;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 6px 22px;
            border-radius: 999px;
            border: 1px solid rgba(255, 179, 0, 0.35);
            background: radial-gradient(circle at 0% 0%, rgba(255,179,0,0.12), transparent 60%);
        }

        .separator {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            transform: translateY(-1px);
            font-weight: 300;
            opacity: 0.8;
        }

        .proximamente {
            font-size: 1.22rem;
            color: var(--text-soft);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin: 52px 0 52px;
            font-weight: 300;
            text-indent: 0.5em;
        }

        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            padding-top: 30px;
            width: 100%;
            max-width: 520px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(120px, 1fr));
            gap: 40px;
            align-items: start;
            justify-items: center;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .contact-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.28em;
        }

        .link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 999px;
        }

        .icon {
            width: 38px;
            height: 38px;
            transition:
                transform 0.28s ease,
                stroke 0.28s ease,
                fill 0.28s ease;
        }

        .icon-wa path {
            fill: none;
            stroke: var(--wa-color);
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-ig rect,
        .icon-ig circle {
            fill: none;
            stroke: var(--ig-color);
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-ig .ig-dot {
            fill: var(--ig-color);
            stroke: none;
        }

        .link:hover .icon,
        .link:focus-visible .icon {
            transform: translateY(-4px);
        }

        .link:focus-visible {
            outline: 1px solid rgba(255, 179, 0, 0.7);
            outline-offset: 4px;
        }

        footer {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #555555;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (max-width: 520px) {
            h1 {
                letter-spacing: 0.42em;
                text-indent: 0.42em;
            }

            .profesion {
                font-size: 0.95rem;
                letter-spacing: 0.24em;
                padding-inline: 18px;
            }

            .proximamente {
                font-size: 1.06rem;
                letter-spacing: 0.38em;
                text-indent: 0.38em;
                margin: 44px 0 44px;
            }

            .contact-grid {
                gap: 30px;
            }

            .contact-label {
                font-size: 0.76rem;
                letter-spacing: 0.22em;
            }
        }

        @media (min-width: 768px) {
            body {
                padding-top: 48px;
            }

            main {
                gap: 40px;
            }

            header {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Alejandro Fabian</h1>
            <p class="tagline">FX &amp; VFX artist</p>
        </header>

        <section aria-label="Portada principal" class="media-container">
            <img src="portada.jpg" alt="Portada cinematográfica del portfolio de FX y VFX de Alejandro Fabian">
        </section>

        <section aria-label="Especialidades">
            <div class="profesion">
                <span>FX</span>
                <span class="separator">|</span>
                <span>VFX</span>
            </div>
        </section>

        <section aria-label="Próximamente portfolio completo">
            <p class="proximamente">Próximamente</p>
        </section>

        <section class="contact-section" aria-label="Contacto y portfolio">
            <div class="contact-grid">
                <div class="contact-item">
                    <p class="contact-label">Contacto</p>
                    <a
                        href="https://wa.me/54911XXXXXXXX"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="link"
                        aria-label="Contactar por WhatsApp a Alejandro Fabian, se abre en una nueva pestaña"
                    >
                        <!-- WhatsApp: globo con flecha + teléfono inside -->
                        <svg class="icon icon-wa" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 3.2a8.3 8.3 0 0 0-7 12.8L4 20l4-1a8.3 8.3 0 1 0 4-15.8Z"/>
                            <path d="M10.1 8.7c.15-.35.35-.4.58-.4h.5c.16 0 .36.06.52.26.16.2.64.86.64 1.48s-.33.97-.47 1.13c-.14.17-.3.36-.1.7.2.34.9 1.43 1.93 1.94.33.17.52.13.7-.05.18-.19.78-.91 1-.99.22-.08.37-.06.52.03.15.1.94.44 1.1.52.16.08.27.12.31.2.04.08.04.46-.15.9-.2.44-1.14.87-1.57.94-.4.06-.9.09-1.47-.1-.35-.12-.8-.27-1.38-.52-2.43-1.06-4.01-3.53-4.13-3.7-.12-.17-.98-1.3-.98-2.48 0-1.18.62-1.75.84-2Z"/>
                        </svg>
                    </a>
                </div>

                <div class="contact-item">
                    <p class="contact-label">Portfolio</p>
                    <a
                        href="https://www.instagram.com/alefabianvfx?igsh=YWkyZmtwaW8zdjVy"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="link"
                        aria-label="Instagram de Alejandro Fabian, se abre en una nueva pestaña"
                    >
                        <svg class="icon icon-ig" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
                            ircle cx="12" cy="12" r="4.5"/>
                            ircle class="ig-dot" cx="17" cy="7" r="0.9"/>
                        </svg>
                    </a>
                </div>
            </div>
        </section>

        <footer>
            © <span id="year"></span> Alejandro Fabian
        </footer>
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>

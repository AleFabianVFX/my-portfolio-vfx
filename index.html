<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEJANDRO FABIAN | FX & VFX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            text-align: center;
        }

        /* Contenedor para centrar el nombre entre el borde y la foto */
        .header-section {
            height: 120px; /* Ajusta esta altura para dar más o menos aire total */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 8px;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
        }

        .media-container {
            width: 95%;
            max-width: 900px;
            margin-bottom: 30px;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        img {
            width: 100%;
            display: block;
        }

        .profesion {
            color: #FFB300; 
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin: 0;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .separator {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            padding-bottom: 4px; /* Alineación óptica de la barra */
        }

        .proximamente {
            font-size: 1.1rem; /* Más grande */
            color: #888; /* Gris más claro y visible */
            letter-spacing: 7px;
            text-transform: uppercase;
            margin: 50px 0 70px 0;
            font-weight: 300;
        }

        .contact-section {
            border-top: 1px solid #1a1a1a;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-bottom: 80px;
            width: 80%;
            max-width: 400px;
        }

        .contact-section p {
            font-size: 0.8rem;
            color: #666;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .icons-container {
            display: flex;
            gap: 40px;
        }

        .icon {
            width: 45px;
            height: 45px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .icon-ig { fill: #E4405F; }
        .icon-wa { fill: #25D366; }

        .link:hover .icon {
            transform: translateY(-10px);
            filter: brightness(1.2);
        }

        .link { text-decoration: none; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>ALEJANDRO FABIAN</h1>
    </div>

    <div class="media-container">
        <img src="portada.jpg" alt="Alejandro Fabian VFX Portfolio">
    </div>

    <div class="profesion">
        <span>FX</span>
        <span class="separator">|</span>
        <span>VFX</span>
    </div>
    
    <div class="proximamente">Próximamente...</div>

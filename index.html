<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEJANDRO FABIAN | FX &amp; VFX</title>
    <meta name="description" content="Portfolio y contacto de Alejandro Fabian, artista de FX &amp; VFX.">
    <style>
        :root {
            --bg: #050505;
            --surface: #101010;
            --border: #262626;
            --text: #ffffff;
            --text-muted: #777777;
            --accent: #ffb300;
            --radius: 12px;
            --shadow-strong: 0 22px 70px rgba(0, 0, 0, 0.9);
            --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.85);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px 64px;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: clamp(1.9rem, 3vw, 2.4rem);
            letter-spacing: 0.6em;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
            text-indent: 0.6em; /* compensa el primer espacio */
        }

        .tagline {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            margin: 0;
        }

        .media-container {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-strong);
            background: var(--surface);
        }

        .media-container img {
            width: 100%;
            display: block;
        }

        .profesion {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            margin: 4px 0 0;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 179, 0, 0.25);
        }

        .separator {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            transform: translateY(-1px); /* alineación óptica */
        }

        .proximamente {
            font-size: 1.1rem;              /* más grande */
            color: #aaaaaa;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin: 44px 0 44px;            /* centrado entre FX/VFX y la línea */
            font-weight: 300;
        }

        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.18); /* línea fina pero visible */
            padding-top: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 420px;
        }

        .contact-section p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.3em;
        }

        .icons-container {
            display: flex;
            gap: 40px;                /* más separación entre íconos */
            justify-content: center;
        }

        .link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon {
            width: 40px;              /* un poco más finos y equilibrados */
            height: 40px;
            transition:
                transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                filter 0.3s ease;
        }

        .icon-ig { fill: #C13584; }   /* color solicitado para Instagram */
        .icon-wa { fill: #25D366; }   /* verde oficial WhatsApp */

        .link:hover .icon,
        .link:focus-visible .icon {
            transform: translateY(-6px);
            filter: brightness(1.2);
        }

        .link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
            border-radius: 999px;
        }

        footer {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #555555;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            body {
                padding-top: 48px;
            }

            main {
                gap: 40px;
            }

            header {
                gap: 16px;
            }

            .proximamente {
                margin-top: 48px;
                margin-bottom: 48px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Alejandro Fabian</h1>
            <p class="tagline">FX &amp; VFX artist</p>
        </header>

        <section aria-label="Portada principal" class="media-container">
            <img src="portada.jpg" alt="Portada cinematográfica del portfolio de FX y VFX de Alejandro Fabian">
        </section>

        <section aria-label="Especialidades">
            <div class="profesion">
                <span>FX</span>
                <span class="separator">|</span>
                <span>VFX</span>
            </div>
        </section>

        <section aria-label="Próximamente portfolio completo">
            <p class="proximamente">Próximamente</p>
        </section>

        <section class="contact-section" aria-label="Contacto y redes">
            <p>Contacto y portfolio</p>
            <div class="icons-container">
                <!-- WhatsApp (primero, icono oficial redondo) -->
                <a
                    href="https://wa.me/54911XXXXXXXX"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link"
                    aria-label="Contactar por WhatsApp a Alejandro Fabian, se abre en una nueva pestaña"
                >

                    </svg>
                </a>

                <!-- Instagram (a la derecha, color #C13584) -->
                <a
                    href="https://www.instagram.com/alefabianvfx?igsh=YWkyZmtwaW8zdjVy"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link"
                    aria-label="Instagram de Alejandro Fabian, se abre en una nueva pestaña"
                >
                    <svg class="icon icon-ig" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                </a>
            </div>
        </section>

        <footer>
            © <span id="year"></span> Alejandro Fabian
        </footer>
    </main>

    <script>
        // Año dinámico
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>

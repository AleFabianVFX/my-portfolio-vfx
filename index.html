<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEJANDRO FABIAN | FX &amp; VFX</title>
    <meta name="description" content="Portfolio y contacto de Alejandro Fabian, artista de FX &amp; VFX.">
    <style>
        :root {
            --bg: #050505;
            --surface: #101010;
            --border: #2b2b2b;
            --text: #ffffff;
            --text-muted: #7a7a7a;
            --text-soft: #a8a8a8;
            --accent: #ffb300;
            --wa-color: #25D366;
            --ig-color: #FCAF45;
            --radius: 12px;
            --shadow-strong: 0 22px 70px rgba(0, 0, 0, 0.9);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px 64px;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: clamp(1.9rem, 3vw, 2.4rem);
            letter-spacing: 0.6em;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
            text-indent: 0.6em;
        }

        .tagline {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            margin: 0;
        }

        .media-container {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-strong);
            background: var(--surface);
        }

        .media-container img {
            width: 100%;
            display: block;
        }

        .profesion {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin: 6px 0 0;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 6px 22px;
            border-radius: 999px;
            border: 1px solid rgba(255, 179, 0, 0.35);
            background: radial-gradient(circle at 0% 0%, rgba(255,179,0,0.12), transparent 60%);
        }

        .separator {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            transform: translateY(-1px);
            font-weight: 300;
            opacity: 0.8;
        }

        .proximamente {
            font-size: 1.22rem;
            color: var(--text-soft);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin: 52px 0 52px;
            font-weight: 300;
            text-indent: 0.5em;
        }

        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            padding-top: 30px;
            width: 100%;
            max-width: 520px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(120px, 1fr));
            gap: 40px;
            align-items: start;
            justify-items: center;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .contact-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.28em;
        }

        .link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 74px;
            height: 74px;
            border-radius: 999px;
        }

        .icon {
            width: 60px;
            height: 60px;
            transition:
                transform 0.28s ease,
                stroke 0.28s ease,
                fill 0.28s ease;
        }

        .icon-wa .wa-ring {
            fill: none;
            stroke: var(--wa-color);
            stroke-width: 0.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-wa .wa-phone {
            fill: var(--wa-color);
            stroke: none;
        }

        .icon-ig rect,
        .icon-ig circle {
            fill: none;
            stroke: var(--ig-color);
            stroke-width: 0.55;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-ig .ig-dot {
            fill: var(--ig-color);
            stroke: none;
        }

        .link:hover .icon,
        .link:focus-visible .icon {
            transform: translateY(-4px);
        }

        .link:focus-visible {
            outline: 1px solid rgba(255, 179, 0, 0.7);
            outline-offset: 4px;
        }

        footer {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #555555;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (max-width: 520px) {
            h1 {
                letter-spacing: 0.42em;
                text-indent: 0.42em;
            }

            .profesion {
                font-size: 0.95rem;
                letter-spacing: 0.24em;
                padding-inline: 18px;
            }

            .proximamente {
                font-size: 1.06rem;
                letter-spacing: 0.38em;
                text-indent: 0.38em;
                margin: 44px 0 44px;
            }

            .contact-grid {
                gap: 30px;
            }

            .contact-label {
                font-size: 0.76rem;
                letter-spacing: 0.22em;
            }
        }

        @media (min-width: 768px) {
            body {
                padding-top: 48px;
            }

            main {
                gap: 40px;
            }

            header {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Alejandro Fabian</h1>
            <p class="tagline">FX &amp; VFX artist</p>
        </header>

        <section aria-label="Portada principal" class="media-container">
            <img src="portada.jpg" alt="Portada cinematográfica del portfolio de FX y VFX de Alejandro Fabian">
        </section>

        <section aria-label="Especialidades">
            <div class="profesion">
                <span>FX</span>
                <span class="separator">|</span>
                <span>VFX</span>
            </div>
        </section>

        <section aria-label="Próximamente portfolio completo">
            <p class="proximamente">Próximamente</p>
        </section>

        <section class="contact-section" aria-label="Contacto y portfolio">
            <div class="contact-grid">
                <div class="contact-item">
                    <p class="contact-label">Contacto</p>
                    <a
                        href="https://wa.me/54911XXXXXXXX"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="link"
                        aria-label="Contactar por WhatsApp a Alejandro Fabian, se abre en una nueva pestaña"
                    >
                        <svg class="icon icon-wa" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path class="wa-ring" d="M12 3.25c-4.83 0-8.75 3.82-8.75 8.53 0 1.68.5 3.23 1.35 4.55L3.7 20.75l4.6-1.2c1.2.64 2.57.98 3.95.98 4.83 0 8.75-3.82 8.75-8.53S16.83 3.25 12 3.25Z"/>
                            <path class="wa-phone" d="M9.85 7.95c-.22.06-.42.2-.53.4-.5.85-.58 1.84-.18 2.83.47 1.18 1.34 2.3 2.5 3.32 1.15 1 2.38 1.7 3.63 2.04 1.04.28 2 .1 2.8-.53.18-.14.28-.36.27-.59l-.04-.92c-.01-.25-.16-.48-.38-.57l-1.52-.63c-.24-.1-.52-.05-.71.13l-.8.72c-.16.14-.38.19-.58.12-.64-.22-1.33-.64-2.06-1.28-.74-.65-1.28-1.31-1.63-1.93-.1-.18-.09-.41.02-.58l.55-.86c.13-.21.15-.47.04-.69l-.69-1.46c-.11-.23-.35-.37-.6-.36l-.89.04Z"/>
                        </svg>
                    </a>
                </div>

                <div class="contact-item">
                    <p class="contact-label">Portfolio</p>
                    <a
                        href="https://www.instagram.com/alefabianvfx?igsh=YWkyZmtwaW8zdjVy"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="link"
                        aria-label="Instagram de Alejandro Fabian, se abre en una nueva pestaña"
                    >
                        <svg class="icon icon-ig" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
                            <circle cx="12" cy="12" r="4.5"/>
                            <circle class="ig-dot" cx="17" cy="7" r="0.9"/>
                        </svg>
                    </a>
                </div>
            </div>
        </section>

        <footer>
            © <span id="year"></span> Alejandro Fabian
        </footer>
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEJANDRO FABIAN | FX &amp; VFX</title>
    <meta name="description" content="Portfolio y contacto de Alejandro Fabian, artista de FX &amp; VFX.">
    <style>
        :root {
            --bg: #050505;
            --surface: #101010;
            --border: #1a1a1a;
            --text: #ffffff;
            --text-muted: #777777;
            --accent: #ffb300;
            --accent-soft: rgba(255, 179, 0, 0.18);
            --radius: 12px;
            --shadow-strong: 0 22px 70px rgba(0, 0, 0, 0.9);
            --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.85);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px 64px;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: clamp(1.9rem, 3vw, 2.4rem);
            letter-spacing: 0.6em;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
            text-indent: 0.6em; /* compensar el primer espacio */
        }

        .tagline {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            margin: 0;
        }

        .media-container {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-strong);
            background: var(--surface);
        }

        .media-container img {
            width: 100%;
            display: block;
        }

        .profesion {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            margin: 4px 0 0;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 18px;
            border-radius: 999px;
            background: radial-gradient(circle at 0% 0%, var(--accent-soft), transparent 60%);
            border: 1px solid rgba(255, 179, 0, 0.25);
        }

        .separator {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            transform: translateY(-1px); /* alineación óptica */
        }

        .proximamente {
            font-size: 0.95rem;
            color: #aaaaaa;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin: 36px 0 32px;
            font-weight: 300;
        }

        .contact-section {
            border-top: 1px solid var(--border);
            padding-top: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 420px;
        }

        .contact-section p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.3em;
        }

        .icons-container {
            display: flex;
            gap: 32px;
            justify-content: center;
        }

        .link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon {
            width: 42px;
            height: 42px;
            transition:
                transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                filter 0.35s ease,
                box-shadow 0.35s ease;
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.7));
        }

        .icon-ig { fill: #e4405f; }
        .icon-wa { fill: #25d366; }

        .link:hover .icon,
        .link:focus-visible .icon {
            transform: translateY(-8px);
            filter: brightness(1.25) drop-shadow(0 0 14px rgba(0, 0, 0, 0.9));
        }

        .link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
            border-radius: 999px;
        }

        footer {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #555555;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            body {
                padding-top: 48px;
            }

            main {
                gap: 40px;
            }

            header {
                gap: 16px;
            }

            .proximamente {
                margin-top: 40px;
                margin-bottom: 36px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Alejandro Fabian</h1>
            <p class="tagline">FX &amp; VFX artist</p>
        </header>

        <section aria-label="Portada principal" class="media-container">
            <img src="portada.jpg" alt="Portada cinematográfica del portfolio de FX y VFX de Alejandro Fabian">
        </section>

        <section aria-label="Especialidades">
            <div class="profesion">
                <span>FX</span>
                <span class="separator">|</span>
                <span>VFX</span>
            </div>

        <section aria-label="Próximamente portfolio completo">

                    </svg>
                </a>
            </div>
        </section>

        <footer>
            © <span id="year"></span> Alejandro Fabian
        </footer>
    </main>

    <script>
        // Año dinámico
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>

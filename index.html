<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEJANDRO FABIAN | FX &amp; VFX</title>
    <meta name="description" content="Portfolio y contacto de Alejandro Fabian, artista de FX &amp; VFX.">
    <style>
        :root {
            --bg: #050505;
            --surface: #101010;
            --border: #2b2b2b;
            --text: #ffffff;
            --text-muted: #7a7a7a;
            --text-soft: #a8a8a8;
            --accent: #ffb300;
            --wa-color: #25D366;
            --ig-color: #FCAF45;
            --radius: 12px;
            --shadow-strong: 0 22px 70px rgba(0, 0, 0, 0.9);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px 64px;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: clamp(1.9rem, 3vw, 2.4rem);
            letter-spacing: 0.6em;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
            text-indent: 0.6em;
        }

        .tagline {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            margin: 0;
        }

        .media-container {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-strong);
            background: var(--surface);
        }

        .video-wrap {
            position: relative;
            width: 100%;
            background: #000;
        }

        .hero-video {
            width: 100%;
            display: block;
            background: #000;
        }

        .video-play {
            position: absolute;
            right: 18px;
            bottom: 18px;
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.82);
            background: rgba(0,0,0,0.14);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition:
                transform 0.28s ease,
                border-color 0.28s ease,
                background 0.28s ease,
                opacity 0.28s ease;
        }

        .video-play svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-left: 1px;
        }

        .video-wrap:hover .video-play,
        .video-play:hover,
        .video-play:focus-visible {
            transform: translateY(-2px);
            background: rgba(0,0,0,0.28);
            border-color: rgba(255,255,255,0.96);
        }

        .video-wrap.is-playing .video-play {
            opacity: 0;
            pointer-events: none;
        }

        .profesion {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin: 6px 0 0;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 6px 22px;
            border-radius: 999px;
            border: 1px solid rgba(255, 179, 0, 0.35);
            background: radial-gradient(circle at 0% 0%, rgba(255,179,0,0.12), transparent 60%);
        }

        .separator {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            transform: translateY(-1px);
            font-weight: 300;
            opacity: 0.8;
        }

        .proximamente {
            font-size: 1.22rem;
            color: var(--text-soft);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin: 52px 0 52px;
            font-weight: 300;
            text-indent: 0.5em;
        }

        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            padding-top: 30px;
            width: 100%;
            max-width: 520px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(120px, 1fr));
            gap: 40px;
            align-items: start;
            justify-items: center;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .contact-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.28em;
        }

        .link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 74px;
            height: 74px;
            border-radius: 999px;
        }

        .icon,
        .icon-wa-img {
            width: 60px;
            height: 60px;
            display: block;
            object-fit: contain;
            transition:
                transform 0.28s ease,
                stroke 0.28s ease,
                fill 0.28s ease;
        }

        .icon-wa path {
            fill: none;
            stroke: var(--wa-color);
            stroke-width: 0.55;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-ig rect,
        .icon-ig circle {
            fill: none;
            stroke: var(--ig-color);
            stroke-width: 0.55;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-ig .ig-dot {
            fill: var(--ig-color);
            stroke: none;
        }

        .link:hover .icon,
        .link:focus-visible .icon,
        .link:hover .icon-wa-img,
        .link:focus-visible .icon-wa-img {
            transform: translateY(-4px);
        }

        .link:focus-visible,
        .video-play:focus-visible {
            outline: 1px solid rgba(255, 179, 0, 0.7);
            outline-offset: 4px;
        }

        footer {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #555555;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (max-width: 520px) {
            h1 {
                letter-spacing: 0.42em;
                text-indent: 0.42em;
            }

            .profesion {
                font-size: 0.95rem;
                letter-spacing: 0.24em;
                padding-inline: 18px;
            }

            .proximamente {
                font-size: 1.06rem;
                letter-spacing: 0.38em;
                text-indent: 0.38em;
                margin: 44px 0 44px;
            }

            .contact-grid {
                gap: 30px;
            }

            .contact-label {
                font-size: 0.76rem;
                letter-spacing: 0.22em;
            }

            .video-play {
                width: 40px;
                height: 40px;
                right: 14px;
                bottom: 14px;
            }
        }

        @media (min-width: 768px) {
            body {
                padding-top: 48px;
            }

            main {
                gap: 40px;
            }

            header {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Alejandro Fabian</h1>
            <p class="tagline">FX &amp; VFX artist</p>
        </header>

        <section aria-label="Portada principal" class="media-container">
            <div class="video-wrap">
                <video
                    class="hero-video"
                    controls
                    preload="metadata"
                    playsinline
                    poster="portada.jpg"
                >
                    <source src="reel.mp4" type="video/mp4">
                    Tu navegador no soporta video HTML5.
                </video>

                <button class="video-play" type="button" aria-label="Reproducir video">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M8 6.5v11l9-5.5-9-5.5Z"></path>
                    </svg>
                </button>
            </div>
        </section>

        <section aria-label="Especialidades">
            <div class="profesion">
                <span>FX</span>
                <span class="separator">|</span>
                <span>VFX</span>
            </div>
        </section>

        <section aria-label="Próximamente portfolio completo">
            <p class="proximamente">Próximamente</p>
        </section>

        <section class="contact-section" aria-label="Contacto y portfolio">
            <div class="contact-grid">
                <div class="contact-item">
                    <p class="contact-label">Contacto</p>
                    <a
                        href="https://wa.me/5491165044902"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="link"
                        aria-label="Contactar por WhatsApp a Alejandro Fabian, se abre en una nueva pestaña"
                    >
                        <img
                            class="icon-wa-img"
                            src="wa-logo.png"
                            alt="WhatsApp"
                            width="60"
                            height="60"
                        >
                    </a>
                </div>

                <div class="contact-item">
                    <p class="contact-label">Portfolio</p>
                    <a
                        href="https://www.instagram.com/alefabianvfx?igsh=YWkyZmtwaW8zdjVy"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="link"
                        aria-label="Instagram de Alejandro Fabian, se abre en una nueva pestaña"
                    >
                        <svg class="icon icon-ig" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect>
                            <circle cx="12" cy="12" r="4.5"></circle>
                            <circle class="ig-dot" cx="17" cy="7" r="0.9"></circle>
                        </svg>
                    </a>
                </div>
            </div>
        </section>

        <footer>
            © <span id="year"></span> Alejandro Fabian
        </footer>
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const videoWrap = document.querySelector('.video-wrap');
        const video = document.querySelector('.hero-video');
        const playBtn = document.querySelector('.video-play');

        if (videoWrap && video && playBtn) {
            playBtn.addEventListener('click', () => {
                video.play();
            });

            video.addEventListener('play', () => {
                videoWrap.classList.add('is-playing');
            });

            video.addEventListener('pause', () => {
                videoWrap.classList.remove('is-playing');
            });

            video.addEventListener('ended', () => {
                videoWrap.classList.remove('is-playing');
            });
        }
    </script>
</body>
</html>

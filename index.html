<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEJANDRO FABIAN | FX &amp; VFX</title>
    <meta name="description" content="Portfolio y contacto de Alejandro Fabian, artista de FX &amp; VFX.">
    <style>
        :root {
            --bg: #050505;
            --surface: #101010;
            --border: #2b2b2b;
            --text: #ffffff;
            --text-muted: #7a7a7a;
            --text-soft: #a8a8a8;
            --accent: #ffb300;
            --ig: #4A4A4A;
            --wa: #6b6b6b;
            --radius: 12px;
            --shadow-strong: 0 22px 70px rgba(0, 0, 0, 0.9);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px 64px;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: clamp(1.9rem, 3vw, 2.4rem);
            letter-spacing: 0.6em;
            margin: 0;
            font-weight: 300;
            text-transform: uppercase;
            text-indent: 0.6em;
        }

        .tagline {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            margin: 0;
        }

        .media-container {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-strong);
            background: var(--surface);
        }

        .media-container img {
            width: 100%;
            display: block;
        }

        .profesion {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.28em;
            margin: 4px 0 0;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0;
            border: 0;
        }

        .separator {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            transform: translateY(-1px);
            font-weight: 300;
            opacity: 0.8;
        }

        .proximamente {
            font-size: 1.22rem;
            color: var(--text-soft);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin: 52px 0 52px;
            font-weight: 300;
            text-indent: 0.5em;
        }

        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            padding-top: 30px;
            width: 100%;
            max-width: 520px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(100px, 1fr));
            gap: 40px;
            align-items: start;
            justify-items: center;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .contact-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.28em;
        }

        .link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 999px;
        }

        .icon {
            width: 30px;
            height: 30px;
            transition:
                transform 0.28s ease,
                opacity 0.28s ease,
                color 0.28s ease;
            stroke-width: 1.5;
        }

        .icon-wa {
            color: var(--wa);
        }

        .icon-ig {
            color: var(--ig);
        }

        .link:hover .icon,
        .link:focus-visible .icon {
            transform: translateY(-4px);
            opacity: 1;
        }

        .link:hover .icon-wa,
        .link:focus-visible .icon-wa {
            color: #8a8a8a;
        }

        .link:hover .icon-ig,
        .link:focus-visible .icon-ig {
            color: #7a7a7a;
        }

        .link:focus-visible {
            outline: 1px solid rgba(255, 179, 0, 0.65);
            outline-offset: 4px;
        }

        footer {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #555555;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (max-width: 520px) {
            h1 {
                letter-spacing: 0.42em;
                text-indent: 0.42em;
            }

            .profesion {
                font-size: 0.95rem;
                letter-spacing: 0.22em;
                gap: 10px;
            }

            .proximamente {
                font-size: 1.05rem;
                letter-spacing: 0.38em;
                text-indent: 0.38em;
                margin: 44px 0 44px;
            }

            .contact-grid {
                gap: 28px;
            }

            .contact-label {
                font-size: 0.76rem;
                letter-spacing: 0.22em;
            }
        }

        @media (min-width: 768px) {
            body {
                padding-top: 48px;
            }

            main {
                gap: 40px;
            }

            header {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Alejandro Fabian</h1>
            <p class="tagline">FX &amp; VFX artist</p>
        </header>

        <section aria-label="Portada principal" class="media-container">
            <img src="portada.jpg" alt="Portada cinematográfica del portfolio de FX y VFX de Alejandro Fabian">
        </section>

        <section aria-label="Especialidades">
            <div class="profesion">
                <span>FX</span>
                <span class="separator">|</span>
                <span>VFX</span>
            </div>
        </section>

        <section aria-label="Próximamente portfolio completo">
